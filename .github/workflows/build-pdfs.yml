name: Build CCC Card PDFs

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    name: Build Single-Sided PDFs (Landscape & Portrait)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate single-sided PDFs (Landscape & Portrait)
        run: npm run generate:both

      - name: Verify generated PDFs
        run: |
          ls -lh output/*.pdf
          test -f output/couples_conversation_cards_portrait_4x6.pdf
          test -f output/couples_conversation_cards_landscape_4x6.pdf

      - name: Upload Portrait PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: couples_conversation_cards_portrait_4x6
          path: output/couples_conversation_cards_portrait_4x6.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload Landscape PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: couples_conversation_cards_landscape_4x6
          path: output/couples_conversation_cards_landscape_4x6.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct PDF Assets to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Printable 4x6 Cards' }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            output/couples_conversation_cards_portrait_4x6.pdf
            output/couples_conversation_cards_landscape_4x6.pdf
